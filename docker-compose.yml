# ============================================================================
# HiveMind: Docker Compose for local development and demo
# ============================================================================
# Starts: HiveMind server + PostgreSQL (pgvector) + Redis
#
# Usage:
#   cp .env.example .env   # fill in your secrets
#   docker compose up -d
#   docker compose logs -f hivemind
#
# To reset all data:
#   docker compose down -v
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # HiveMind: FastAPI + MCP server
  # --------------------------------------------------------------------------
  hivemind:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Point the server at the compose services. hivemind/config.py only reads
      # variables carrying the HIVEMIND_ prefix; unprefixed names are ignored.
      HIVEMIND_DATABASE_URL: "postgresql+asyncpg://hivemind:hivemind@postgres:5432/hivemind"
      HIVEMIND_REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim ships no curl; probe with the interpreter instead.
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # --------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind
      POSTGRES_DB: hivemind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind -d hivemind"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis 7: Celery broker + rate limiter state
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
