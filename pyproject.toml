[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hivemind-mcp"
version = "0.1.0"
description = "Shared memory for AI agents, served over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # MCP server
    # fastmcp 4.x serves MCP revision 2026-07-28 (no sessions) and the handshake
    # revisions on the same URL. It builds on the mcp v2 SDK and requires
    # starlette >= 1.0.1, hence fastapi >= 0.133.0, the first release that accepts
    # starlette 1.x.
    "fastmcp>=4.0.3,<5",
    "fastapi>=0.133.0",
    "uvicorn",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    # asyncpg: research pinned <0.29.0 for Python 3.11 compat; Python 3.14 requires >=0.30
    "asyncpg>=0.30.0",
    # psycopg2-binary: sync PostgreSQL driver for CLI (avoids asyncio event loop issues)
    "psycopg2-binary",
    "pgvector",
    "alembic",
    # PII pipeline
    "presidio-analyzer[gliner]",
    "presidio-anonymizer",
    "gliner",
    # Embeddings
    "sentence-transformers",
    # Validation and config
    # pydantic >= 2.12: floor of fastmcp 4.0.3 and of the mcp 2.1.1 SDK.
    "pydantic>=2.12",
    "pydantic-settings",
    # CLI
    "typer",
    "rich",
    "questionary",
    # Supporting
    "spacy",
    "python-jose[cryptography]",
    "httpx",
    # Async task queue
    "celery",
    "redis",
    # Security: RBAC + rate limiting
    "pycasbin",
    "casbin-async-sqlalchemy-adapter",
    "fastapi-limiter",
    # Near-duplicate detection (KM-03)
    "datasketch",
    # SSE streaming endpoint (DASH-01)
    "sse-starlette>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "openapi-python-client",
    "asgi-lifespan>=2.1.0",
    "pyyaml>=6.0.3",
]

# Not part of the published metadata (PEP 735), so the wheel stays publishable while
# uv.lock still pins the spaCy model presidio loads at startup. The Dockerfile installs
# it with `uv sync --group models`; the runtime image has neither pip nor uv.
[dependency-groups]
models = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
hivemind = "hivemind.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["hivemind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["models: exige le telechargement d'un modele (lancement separe)"]
