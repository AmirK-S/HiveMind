# Expected conformance failures for HiveMind on MCP revision 2026-07-28.
#
# Tool: @modelcontextprotocol/conformance@0.2.0-alpha.11
# Run:  npx conformance server --url http://localhost:8000/mcp \
#         --requirements 2026-07-28 \
#         --expected-failures conformance/expected-failures-2026-07-28.yaml
#
# HiveMind is a business server. It exposes seven domain tools and no prompts,
# no resources, no completion and no tasks extension. The conformance suite is a
# reference-server validator: most of its scenarios drive tools, prompts and
# resources with imposed names (test_simple_text, test_input_required_result_*,
# json_schema_2020_12_tool, ...). Every entry below is one of those, and each
# carries the one-line reason on the same line.
#
# Entry grammar: "<scenario>" waives the whole scenario, "<scenario>:<check-id>"
# waives exactly one check and keeps the scenario's other checks enforced.

server:
